{% load i18n %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* General Reset */
        body {
            font-family: 'Poppins', Arial, sans-serif;
            background-color: #f5f5f5;
            color: #212529;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            background-color: #ffffff;
            border-radius: 8px;
            border: 1px solid #e5e5e5;
            overflow: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #b71c1c, #000000);
            color: #ffffff;
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 26px;
            letter-spacing: 1px;
        }

        /* Content */
        .content {
            padding: 30px 25px;
            font-size: 15px;
            line-height: 1.7;
            color: #333333;
        }

        /* Button */
        .button {
            display: inline-block;
            padding: 12px 25px;
            background-color: #b71c1c;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .button:hover {
            background-color: #000000;
        }

        /* Footer */
        .footer {
            background-color: #000000;
            padding: 15px;
            text-align: center;
            font-size: 12px;
            color: #cccccc;
        }
        .footer a {
            color: #c44e47;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>{% trans "OTech Cloud" %}</h1>
        </div>

        <!-- Content -->
        <div class="content">
            {% block content %}{% endblock %}
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>{% trans "OTECH Engineering | Addis Ababa, Ethiopia" %}</p>
            <p>{% trans "Contact us at" %} <a href="mailto:support@otech.et">support@otech.et</a></p>
        </div>
    </div>
</body>
</html>
