{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        .sidebar {
            transition: transform 0.2s ease-in-out;
        }
        .stat-card {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        .active-nav-dark {
            background-color: #1f2937;
            color: white;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans transition-colors duration-300" id="theme-body">
    <div class="relative min-h-screen md:flex">
        <div id="mobile-backdrop" class="fixed inset-0 bg-black bg-opacity-50 z-20 hidden md:hidden"></div>
        
        <div class="md:hidden flex justify-between items-center bg-gray-900 text-white p-4 z-30 relative">
            <button id="mobile-menu-button" class="text-white focus:outline-none">
                <i class="fas fa-bars fa-lg"></i>
            </button>
            <h1 class="text-xl font-bold">Admin Panel</h1>
        </div>

        {% include 'dashboard/sidebar.html' %}

        <div class="flex-1 flex flex-col">
            {% include 'dashboard/header.html' %}
            
            <main class="flex-1 p-6 bg-gray-100">
                {% block content %}
                {% endblock %}
            </main>
        </div>
    </div>

    <script>
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const sidebar = document.getElementById('sidebar');
        const mobileBackdrop = document.getElementById('mobile-backdrop');
        
        const toggleSidebar = () => {
            const isOpen = sidebar.classList.contains('-translate-x-full');
            if (isOpen) {
                sidebar.classList.remove('-translate-x-full');
                mobileBackdrop.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                mobileBackdrop.classList.add('hidden');
            }
        };
        
        mobileMenuButton.addEventListener('click', toggleSidebar);
        
        mobileBackdrop.addEventListener('click', () => {
            sidebar.classList.add('-translate-x-full');
            mobileBackdrop.classList.add('hidden');
        });

        const userMenuButton = document.getElementById('user-menu-button');
        const userMenu = document.getElementById('user-menu');
        if (userMenuButton) {
            userMenuButton.addEventListener('click', (e) => {
                e.stopPropagation();
                userMenu.classList.toggle('hidden');
            });
        }
        
        const notificationButton = document.getElementById('notification-button');
        const notificationMenu = document.getElementById('notification-menu');
        if (notificationButton) {
            notificationButton.addEventListener('click', (e) => {
                e.stopPropagation();
                notificationMenu.classList.toggle('hidden');
            });
        }

    </script>
    
    {% block extra_js %}{% endblock %}

</body>
</html>
