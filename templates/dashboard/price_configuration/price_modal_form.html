<div class="flex items-center justify-between p-4 md:p-5">
    <h3 class="text-xl font-semibold text-gray-900">
        {% if form.instance.pk %}Update Price{% else %}Add New Price{% endif %}
    </h3>
    <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center" data-modal-hide="price-modal">
        <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 6L1 7l6 6Z" />
        </svg>
        <span class="sr-only">Close modal</span>
    </button>
</div>
<form method="post" action="{% if form.instance.pk %}{% url 'price_update' model_name=model_name pk=form.instance.pk %}{% else %}{% url 'price_create' model_name=model_name %}{% endif %}" class="p-4 md:p-5" onsubmit="handleModalFormSubmit(event)">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="mt-4 flex justify-end space-x-2">
        <button type="button" class="px-4 py-2 border rounded-md font-medium text-white hover:bg-red-700 bg-black" data-modal-hide="price-modal">Cancel</button>
        <button type="submit" class="px-4 py-2 bg-red-600 text-white font-medium rounded-md hover:bg-red-700">Save</button>
    </div>
</form>

<script>
    function handleModalFormSubmit(event) {
        event.preventDefault();
        const form = event.target;
        const formData = new FormData(form);

        fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest', // Crucial for Django
            }
        })
        .then(response => {
            if (response.headers.get("Content-Type").includes("text/html")) {
                // If the response is HTML, it means the form has errors
                return response.text();
            } else {
                // If it's a simple text response, the action was successful
                return "Success";
            }
        })
        .then(html => {
            if (html === "Success") {
                window.closeModal();
                location.reload(); 
            } else {
                // Replace modal content with the form containing errors
                document.getElementById('modal-content').innerHTML = html;
            }
        })
        .catch(error => console.error('Form submission error:', error));
    }
</script>
