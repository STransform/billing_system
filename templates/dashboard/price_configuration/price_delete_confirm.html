<div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">
    <h3 class="text-xl font-semibold text-gray-900 dark:text-white">
        Confirm Deletion
    </h3>
    <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center" data-modal-hide="price-modal">
        <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 6L1 7l6 6Z" />
        </svg>
        <span class="sr-only">Close modal</span>
    </button>
</div>
<form method="post" action="{% url 'price_delete' model_name=model_name pk=object.pk %}" class="p-4 md:p-5" onsubmit="handleModalFormSubmit(event)">
    {% csrf_token %}
    <p class="text-gray-700 dark:text-gray-300">Are you sure you want to delete **"{{ object.id }}"**?</p>
    <div class="mt-4 flex justify-end space-x-2">
        <button type="button" class="px-4 py-2 border rounded-md text-gray-700 hover:bg-gray-100" data-modal-hide="price-modal">Cancel</button>
        <button type="submit" class="px-4 py-2 bg-red-600 text-white font-medium rounded-md hover:bg-red-700">Delete</button>
    </div>
</form>
<script>
    function handleModalFormSubmit(event) {
        event.preventDefault();
        const form = event.target;
        const formData = new FormData(form);

        fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest',
            }
        })
        .then(response => {
            if (response.ok) {
                window.closeModal();
                location.reload();
            } else {
                console.error('Delete request failed.');
                alert('Deletion failed. Please try again.');
            }
        })
        .catch(error => console.error('Delete submission error:', error));
    }
</script>
