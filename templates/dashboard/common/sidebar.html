{% load static %}
<aside id="sidebar" class="sidebar bg-gray-900 text-white w-64 space-y-6 py-7 px-2 absolute inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 z-30 transition-all duration-300 shadow-md">
    <a href="{% url 'core:dashboard' %}" class="flex items-center space-x-3 px-4">
        <img src="{% static 'img/logo.png' %}" alt="Logo" class="w-32">
    </a>
    <nav>
        <!-- Superuser Menu -->
        {% if user.is_superuser %}
            <a href="{% url 'core:billing_dashboard' %}" class="flex items-center py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700 {% if model_code == 'BillingDashboard' %}active-nav-dark{% endif %}">
                <i class="fas fa-tachometer-alt w-6"></i>
                <span class="ml-4">Admin Dashboard</span>
            </a>
            <a href="{% url 'core:price_configuration' %}" class="flex items-center py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700 {% if model_code == 'PriceConfiguration' %}active-nav-dark{% endif %}">
                <i class="fas fa-bell w-6"></i>
                <span class="ml-4">Price Configuration</span>
            </a>
            <a href="{% url 'core:customer_list' %}" class="flex items-center py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700 {% if model_code == 'Customer' %}active-nav-dark{% endif %}">
                <i class="fas fa-users-cog w-6"></i>
                <span class="ml-4">Customers</span>
            </a>
            <a href="{% url 'core:invoice_list' %}" class="flex items-center py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700 {% if model_code == 'Invoice' %}active-nav-dark{% endif %}">
                <i class="fas fa-file-invoice-dollar w-6"></i>
                <span class="ml-4">Invoices</span>
            </a>
            <a href="{% url 'core:subscription_plan_list' %}" class="flex items-center py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700 {% if model_code == 'SubscriptionPlan' %}active-nav-dark{% endif %}">
                <i class="fas fa-box w-6"></i>
                <span class="ml-4">Subscription Plans</span>
            </a>
            <a href="{% url 'core:subscription_list' %}" class="flex items-center py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700 {% if model_code == 'Subscription' %}active-nav-dark{% endif %}">
                <i class="fas fa-receipt w-6"></i>
                <span class="ml-4">Subscriptions</span>
            </a>
            <a href="{% url 'core:contact_submission_list' %}" class="flex items-center py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700 {% if model_code == 'ContactSubmission' %}active-nav-dark{% endif %}">
                <i class="fas fa-envelope w-6"></i>
                <span class="ml-4">Contact Submissions</span>
            </a>
        {% else %}
            <!-- Customer Menu -->
            <a href="{% url 'core:customer_dashboard' %}" class="flex items-center py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700 {% if model_code == 'CustomerDashboard' %}active-nav-dark{% endif %}">
                <i class="fas fa-tachometer-alt w-6"></i>
                <span class="ml-4">Dashboard</span>
            </a>
            <a href="{% url 'accounts:profile' %}" class="flex items-center py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700 {% if model_code == 'CustomerProfile' %}active-nav-dark{% endif %}">
                <i class="fas fa-user w-6"></i>
                <span class="ml-4">My Profile</span>
            </a>
            <a href="{% url 'core:customer_subscriptions' %}" class="flex items-center py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700 {% if model_code == 'CustomerSubscriptions' %}active-nav-dark{% endif %}">
                <i class="fas fa-credit-card w-6"></i>
                <span class="ml-4">My Subscriptions</span>
            </a>
            <a href="{% url 'core:customer_invoices' %}" class="flex items-center py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700 {% if model_code == 'CustomerInvoices' %}active-nav-dark{% endif %}">
                <i class="fas fa-file-invoice w-6"></i>
                <span class="ml-4">My Invoices</span>
            </a>
        {% endif %}
        <!-- Logout/Login Link -->
        {% if user.is_authenticated %}
            <a href="{% url 'accounts:logout' %}" class="flex items-center py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700">
                <i class="fas fa-sign-out-alt w-6"></i>
                <span class="ml-4">Logout</span>
            </a>
        {% else %}
            <a href="{% url 'accounts:login' %}" class="flex items-center py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700">
                <i class="fas fa-sign-in-alt w-6"></i>
                <span class="ml-4">Login</span>
            </a>
        {% endif %}
    </nav>
</aside>
