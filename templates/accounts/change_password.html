{% extends "dashboard/base.html" %}
{% block title %}Change Password{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-6">Change Password</h1>

<form method="post" class="space-y-4 bg-white p-6 rounded-lg shadow-md">
  {% csrf_token %}
  {{ form.non_field_errors }}

  {% for field in form %}
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}
        <p class="text-sm text-red-600 mt-1">{{ field.errors|striptags }}</p>
      {% endif %}
    </div>
  {% endfor %}

  <div>
    <button type="submit" class="px-6 py-3 bg-red-600 text-white font-semibold rounded-lg shadow-md hover:bg-gray-900 transition-colors duration-300">
      Update Password
    </button>
  </div>
</form>
{% endblock %}
